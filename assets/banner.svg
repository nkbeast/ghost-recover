<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="GHOST//RECOVER - Data Recovery Engine for Linux">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.55" stop-color="#56d364"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="#000000" opacity="0.06"/>
  <rect width="1200" height="6" fill="url(#bar)"/>

  <text x="60" y="70" font-family="Courier New, monospace" font-size="15" fill="#8b949e">$ ghost_recover --version</text>
  <text x="60" y="95" font-family="Courier New, monospace" font-size="15" fill="#58a6ff">GHOST//RECOVER 3.0.0 &#8212; data recovery suite</text>

  <text x="600" y="190" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="72" fill="url(#titleGrad)">GHOST//RECOVER</text>
  <text x="600" y="230" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#c9d1d9" letter-spacing="6">DATA RECOVERY ENGINE &#8212; LINUX</text>

  <text x="60" y="275" font-family="Courier New, monospace" font-size="15" fill="#8b949e">$ ghost_recover scan /dev/sda2 --deleted</text>
  <text x="60" y="300" font-family="Courier New, monospace" font-size="15" fill="#3fb950">[+] 3 deleted files recovered &#8212; byte-for-byte identical (md5 verified)</text>
  <rect x="60" y="305" width="10" height="18" fill="#3fb950" opacity="0.9"/>
</svg>
