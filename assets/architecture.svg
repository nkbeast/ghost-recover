<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="GHOST//RECOVER architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

  <text x="600" y="40" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#e6edf3">GHOST//RECOVER &#8212; ENGINE ARCHITECTURE</text>

  <rect x="420" y="70" width="360" height="64" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">/dev/sdX &#183; image &#183; md member</text>
  <text x="600" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">physical disk, raw image, or RAID member</text>

  <line x1="600" y1="134" x2="600" y2="170" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="170" width="360" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="198" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">DiskReader &#8212; windowed, cached I/O</text>
  <text x="600" y="218" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">bounds-checked reads &#183; tolerant of bad sectors &#183; read-only by default</text>

  <line x1="600" y1="234" x2="600" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="270" width="360" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="220" y="298" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">FILESYSTEM DRIVERS &#8212; 25+</text>
  <text x="220" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">metadata walk &#8594; full paths &#8594; extent lists</text>
  <text x="220" y="346" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">ext2/3/4 &#183; NTFS &#183; FAT &#183; exFAT &#183; XFS</text>
  <text x="220" y="368" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">Btrfs &#183; F2FS &#183; HFS+/HFSX &#183; APFS</text>
  <text x="220" y="390" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">ISO 9660 &#183; UDF &#183; SquashFS &#183; cramfs</text>
  <text x="220" y="412" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">romfs &#183; MINIX &#183; JFFS2 &#183; UFS &#183; JFS</text>
  <text x="220" y="436" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#58a6ff">deleted files via journal mining, slack, orphans</text>

  <rect x="420" y="270" width="360" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="298" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">DISK LAYER</text>
  <text x="600" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">partition tables &#8594; deleted-partition recovery</text>
  <text x="600" y="346" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">MBR + EBR chain &#183; GPT + CRC &#183; superblock scan</text>
  <text x="600" y="368" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">RAID 0 / 1 / 5 / 6 / 10 &#183; linear</text>
  <text x="600" y="390" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">md superblocks &#183; blind geometry brute-force</text>
  <text x="600" y="412" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">missing member rebuilt from parity</text>
  <text x="600" y="436" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#58a6ff">honest ambiguity reporting, never guesses</text>

  <rect x="800" y="270" width="360" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="980" y="298" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">SIGNATURE CARVING &#8212; 251 formats</text>
  <text x="980" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">single Aho-Corasick pass over the device</text>
  <text x="980" y="346" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">15 categories &#183; structural length validation</text>
  <text x="980" y="368" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">entropy screening &#183; content-hash dedup</text>
  <text x="980" y="390" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">fragmented-file reassembly</text>
  <text x="980" y="412" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">free-space-only carve option</text>
  <text x="980" y="436" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#58a6ff">whole files at true size, not guesses</text>

  <line x1="600" y1="270" x2="220" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="270" x2="980" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="500" width="560" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="530" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">RECOVERY PIPELINE</text>
  <text x="320" y="558" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">extent-accurate extraction &#8212; fragmented files come out intact</text>
  <text x="320" y="582" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">ddrescue-style imaging with resumable map file</text>
  <text x="320" y="606" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">dry-run repair: ext superblocks &#183; FAT/exFAT boot &#183; NTFS &#183; GPT &#183; MBR</text>
  <text x="320" y="630" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">refuses to write onto the source device</text>
  <text x="320" y="654" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#58a6ff">every output verified by MD5 in the test suite</text>

  <rect x="640" y="500" width="520" height="180" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="900" y="530" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c9d1d9">INTERFACES</text>
  <text x="900" y="562" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">Web UI &#8212; 127.0.0.1:3030</text>
  <text x="900" y="588" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">job polling &#183; preview &#183; hex viewer &#183; file info</text>
  <text x="900" y="614" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3fb950">CLI &#8212; full parity with the UI</text>
  <text x="900" y="640" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">HTTP API &#8212; /api/scan /api/carve /api/raid &#8230;</text>
  <text x="900" y="666" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">pkexec / sudo elevation with handover</text>

  <line x1="600" y1="460" x2="320" y2="500" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="460" x2="900" y2="500" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
